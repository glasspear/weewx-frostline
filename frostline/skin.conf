###############################################################################
#                                                                             #
#                        FROSTLINE WEEWX V5 SKIN                              #
#                                                                             #
#  Adaptive dark/light weather dashboard, interactive charts, Weather Alerts, #
#  All-Time Records, Open-Meteo forecasts, What to Wear, & Station telemetry. #
#                                                                             #
###############################################################################

[Extras]
    # Station identifier shown in the top navigation bar (falls back to $station.location if empty)
    station_code =

    # Top-bar wordmark (e.g. FROSTLINE; optionally add a brand_prefix)
    brand_prefix =
    brand_primary = FROST
    brand_secondary = LINE

    # Primary and secondary sensor station titles
    primary_sensor_title = 5-in-1 Weather Station
    secondary_sensor_title = Lightning Tower
    show_secondary = true

    # Optional additional sensor stations on the Station tab
    # Format: comma-separated Title:tempObs:humidObs:batteryObs
    # Example: Greenhouse:extraTemp2:extraHumid2:batteryStatus2, Garage:extraTemp3:extraHumid3:batteryStatus3
    extra_sensors =

    # Core dashboard card & feature visibility toggles (true / false)
    show_lightning = true
    show_windy = true
    show_forecast = true
    show_alerts = true
    show_station_health = true
    show_quip = true
    show_tides = true
    show_air_quality = true

    # What to Wear tab card toggles (Regular Day is always shown on wear.html;
    # Running Kit and Search & Rescue are off by default and enabled in weewx.conf)
    show_wear_running = false
    show_wear_sar = false

    # Weather commentary banner tone: clean, snarky, or unfiltered
    quip_tone = snarky

    # Rain display units: auto (keeps 'in' for US Imperial, normalizes 'cm'/'mm' to 'mm'), mm, or inch
    rain_units = auto

    # Air quality index standard: auto (US AQI in Americas, EAQI in Europe/RoW), us_aqi, ca_aqhi, or european_aqi
    aqi_standard = auto

    # Tide predictions: provider can be auto, dfo (Fisheries & Oceans Canada IWLS), noaa (US NOAA CO-OPS 7-digit ID), or harmonic
    # tide_units can be auto ('ft' for Fahrenheit stations, 'm' for Celsius), m, or ft
    tide_provider = auto
    tide_units = auto
    tide_title = Local Tides
    tide_station_name = Local Harbour
    tide_station_code =
    tide_station_id =

    # Weather alert provider: auto (Environment Canada / US NWS by coordinates), canada, or us
    alerts_provider = auto

    # Windy.com embed settings
    # Valid overlays include: radar, wind, temp, rain, clouds, pressure
    windy_overlay = radar
    windy_zoom = 8

    # Minutes without a station archive update before the status indicator turns red
    stale_threshold_minutes = 15

    # Cache-busting version query string for CSS and JS assets
    asset_version = 20261124-1

    # Chart.js v4 UMD CDN URL (falls back cleanly to assets/js/chart-fallback.js if offline)
    chartjs_cdn = https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js

###############################################################################
# Unit groups inherit from your weewx.conf settings; group_rain defaults to   #
# mm for metric stations while rain_units = auto also supports US inches.     #
###############################################################################

[Units]
    [[Groups]]
        group_rain = mm
        group_rainrate = mm_per_hour

[CheetahGenerator]
    encoding = utf8

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

        [[[charts]]]
            template = charts.html.tmpl

        [[[records]]]
            template = records.html.tmpl

        [[[wear]]]
            template = wear.html.tmpl

        [[[station]]]
            template = station.html.tmpl

        [[[data_current]]]
            template = data/current.json.tmpl

        [[[data_today]]]
            template = data/today.json.tmpl

        [[[data_week]]]
            template = data/week.json.tmpl

        [[[data_month]]]
            template = data/month.json.tmpl

        [[[data_year]]]
            template = data/year.json.tmpl

[CopyGenerator]
    copy_once = assets/css/*.css, assets/js/*.js, assets/icons/*.svg

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
